<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="brand">MarksonGo</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a class="active" href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="inner-page">
        <h1>Contact MarksonGo</h1>

        <form class="card inquiry-form">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="message">Your Message</label>
            <textarea id="message" placeholder="Write your inquiry"></textarea>

            <button class="button" type="button">
                Submit Inquiry
            </button>

        </form>

        <p class="fine-print">
            Demonstration form only. It does not send information.
        </p>
    </main>

    <footer>© 2026 MarksonGo Travel Desk</footer>

</body>

</html>
